# eventTree v1 schema. Generated; see Format/README and Format/SCHEMA.md.
schema: RJEventTreeV1
version: '1.0'
tree: eventTree
description: One TTree per file. DATA files are one run segment; SIM files are one product part. One entry per event occurrence,
  in source order (evt_src_entry). Per-event quantities are scalars; each collection is a group of equal-length vectors named
  <group>_<field>; sub-objects of photons are flat vectors with a parent index or a fixed stride; links are event-local indices
  (-1 = none).
rules:
  restructure: 'Pure restructure of the production final layout. Dropped: 128-bit row identities (rebuilt from row order and
    indices), per-row strings (stored as integer codes with a dictionary in meta/codes), per-file and per-collection constants
    (meta), and exact duplicates of another stored branch. Everything else, computed values included, is stored at its native
    type. Every drop is verified per file by the converter, which fails closed, and the inverse rebuilds every original table
    bit for bit.'
  storage: 'Collections (the vector<T> types in this schema) are C arrays sized by an Int_t counter: n_<group> for the group,
    or n_<branch> for a member whose length differs from the rest of its group (a strided or empty member). meta/schema records
    the branch-to-counter map. Hash strings are std::vector<std::string>. Files are written with LZMA level 4.'
  versioning: Minor versions only append branches or groups. Readers ignore branches they do not know. Nothing is ever renamed,
    retyped or removed within a major version.
  reserved: Reserved branches are declared by the schema before they are filled. A file that has not been augmented carries
    them empty; meta/schema lists which reserved groups a file fills.
  entries: evt_record = 0 for retained events and 1 for upstream-rejected events (DATA); rejected entries carry only evt_
    fields.
  reader_predicate: evt_record == 0 && evt_nodes_ready == 1 && vtx_valid == 1 && evt_terminal_status == 0
  terminal_status:
    pp:
      0: none
      1: trigger
      2: vz
      3: period
      4: ownership
    auau:
      0: none
      1: trigger
      2: vz
      3: minimum_bias
      4: stitch
      5: centrality
    note: system-specific codes; 0 also marks an early return (evt_nodes_ready == 0)
  jet_collections:
    pp:
    - jet02 (towerinfo_calib, R=0.2)
    - jet03 (R=0.3)
    - jet04 (R=0.4)
    auau:
    - jet02/jet03/jet04 (towerinfo_sub1, UE-subtracted)
    - jetunsub02/03/04 (towerinfo_retower_unsubtracted)
    note: analysis jets carry the same names in pp and Au+Au so one analysis chain reads both; the view is recorded in meta/collections
  truth_jet_collections:
  - truthjet02
  - truthjet03
  - truthjet04
  shower_views:
    order:
    - H70
    - H0
    - G70
    - G0
    - O70
    - O0
    - R70
    stride: 7
    note: shv_ branches have 7 entries per photon in this order; the canonical photon-ID features are the H70 view
  isolation_witnesses:
    radii:
    - 0.3
    - 0.4
    stride: 2
  units: 'energies, pT, ET: GeV; z: cm; angles: rad; times: ns; raw times: ADC samples (x17.6 = ns); centrality: percent;
    MBD charge: a.u.'
