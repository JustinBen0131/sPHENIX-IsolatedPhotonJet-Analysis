  type: vector<int32>
  group: pho
  filled_by: canonical photon-ID augmentation
  title: score evaluation state (1 scored; other values explain why not)
- name: pho_id_class
  type: vector<int32>
  group: pho
  filled_by: canonical photon-ID augmentation
  title: 'photon-ID region from the hash-bound working-point package: 3 tight, 2 excluded gap, 1 non-tight, 0 fail, -1 invalid'
- name: pho_iso_class
  type: vector<int32>
  group: pho
  filled_by: canonical isolation package
  title: 'isolation region from the hash-bound isolation package: 2 isolated, 1 gap, 0 non-isolated, -1 invalid'
- name: jet<RR>_emcal_frac
  type: vector<double>
  group: jet<RR>
  filled_by: per-jet calorimeter fractions (next pass)
  title: fraction of the jet energy in the EMCal
- name: jet<RR>_ihcal_frac
  type: vector<double>
  group: jet<RR>
  filled_by: per-jet calorimeter fractions (next pass)
  title: fraction of the jet energy in the inner HCal
- name: jet<RR>_ohcal_frac
  type: vector<double>
  group: jet<RR>
  filled_by: per-jet calorimeter fractions (next pass)
  title: fraction of the jet energy in the outer HCal
meta:
- key: meta/schema
  content: schema name, version and sha256 of this file; product and layout profile; filled reserved groups
- key: meta/source
  content: the single sources row of the part, verbatim JSON
- key: meta/trigger_run_info
  content: the 64-row GL1 trigger table of the run segment (DATA), JSON with exact floats
- key: meta/centrality_binding
  content: centrality calibration binding (Au+Au DATA; required)
- key: meta/collections
  content: 'jet and truth-jet collections: name, input identity, algorithm, radius, quality bitmask'
- key: meta/constants
  content: per-file constants hoisted from rows, verified constant by the converter
- key: meta/codes
  content: dictionaries for integer-coded strings
- key: meta/policies
  content: mbd_pmt_arm policy, mbd_pmt_charge_valid constant, invalid-JES policy string
- key: meta/source_tree_titles
  content: titles of the source trees, verbatim
- key: meta/replay/*
  content: replay-foundation named objects, verbatim
- key: meta/manifests/*
  content: augmentation, local-qualification, photon-repair and storage manifests, verbatim
- key: meta/converter_receipt
  content: converter version, input and output sha256, inverse-proof result
- key: hist/*
  content: producer histograms, byte copies of the source objects
