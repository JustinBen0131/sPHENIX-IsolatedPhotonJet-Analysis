# =============================================================================
# TreeProduction/config/tree_production.yaml
#
# Reconstruction and storage configuration for the isolated-photon + jet tree
# producer. One file serves p+p and Au+Au, data and simulation; the profile
# named at invocation selects the mode.
#
# This file configures what is reconstructed and what is stored. It does not
# configure identification models, working points, analysis regions, purity,
# response matrices, unfolding, histogram binning or plotting. Those belong to
# the downstream stages and to config/measurement.yaml.
#
# Physics algorithms are implemented in C++. This file supplies values and
# bindings; it never redefines an algorithm.
#
# Per-job values (input files, output file, run, segment, entry range, source
# digests) are passed to the macro by the job, not written here.
# =============================================================================

schema_version: 1

contract:
  name: PhotonJetTrees
  stage: dst_to_tree
  implementation: PhotonJetTree
  embed_resolved_configuration: true
  fail_closed: true

runtime:
  sphenix_release: ana.568
  # Filled by the build and invocation layer.
  producer_git_commit: null
  producer_source_sha256: null
  producer_library_sha256: null
  macro_sha256: null

# -----------------------------------------------------------------------------
# Capture policy
# -----------------------------------------------------------------------------

capture:
  # One event row per event handed to the producer, including events with no
  # photon candidate. The event population is the exposure denominator.
  retain_every_producer_encounter: true

  # Row identities are scoped to their source. Cross-file joins carry the
  # source identity.
  identity_scope: source

# -----------------------------------------------------------------------------
# Input node names
# -----------------------------------------------------------------------------

nodes:
  event_header: EventHeader
  gl1_packet: GL1Packet
  global_vertex_map: GlobalVertexMap
  centrality_info: CentralityInfo
  minimum_bias_info: MinimumBiasInfo
  mbd_out: MbdOut
  mbd_pmts: MbdPmtContainer
  cemc_towers: TOWERINFO_CALIB_CEMC
  ihcal_towers: TOWERINFO_CALIB_HCALIN
  ohcal_towers: TOWERINFO_CALIB_HCALOUT
  cemc_geometry: TOWERGEOM_CEMC
  truth_info: G4TruthInfo
  hepmc_event_map: PHHepMCGenEventMap

# -----------------------------------------------------------------------------
# Calorimeter reconstruction
# -----------------------------------------------------------------------------

calorimeter:
  cluster_builder:
    detector: CEMC
    threshold_energy_gev: 0.070
    profile:
      path: "${CALIBRATIONROOT}/EmcProfile/CEMCprof_Thresh30MeV.root"

  tower_status:
    # Simulation applies this hot-tower map from the conditions database.
    simulation_hot_map_key: CEMC_hotTowers_status

  cemc:
    # Data: pin and validate the zero-suppression cross-calibration payload
    # before the CEMC calibrator runs.
    zero_suppression_cross_calibration: true

  event_energy:
    # Event energy sums admit only towers the calibration marked good. The
    # choice is recorded in every event.
    require_good_towers: true

# -----------------------------------------------------------------------------
# Photon capture
# -----------------------------------------------------------------------------

photons:
  # Storage domain, not the measurement selection.
  capture_domain:
    min_et_gev: 5.0
    max_et_gev: 40.0
    max_abs_eta: 0.7
    # Reconstructed objects (photons and jets) are captured only when the
    # reconstructed vertex is valid and |z| is below this value. The event
    # row is retained either way. Analysis vertex windows are narrower and
    # live in config/measurement.yaml.
    object_vertex_abs_z_max_cm: 60.0

  source_cluster_node: CLUSTERINFO_CEMC
  output_photon_node: PHOTONCLUSTER_CEMC
  topocluster_node: TOPOCLUSTER_ALLCALO

  builder:
    # Threshold of the upstream photon builder. Kept equal to the storage
    # domain so that no candidate the tree could store is dropped upstream.
    # min_et_gev comes from capture_domain; do not duplicate it here.
    # The reference production imposed no vertex cut inside the builder; the
    # producer records the event vertex and leaves any window downstream.
    use_vertex_cut: false
    vertex_cut_cm: 60.0

  shower_shapes:
    # Definitions evaluated for every candidate. H = rectangular sums over the
    # full good-tower 7x7 grid, second moments over cluster-owned towers; the
    # number is the tower energy floor in MeV. These are the two definitions
    # the identification models have used.
    definitions: [H70, H0]

  timing:
    sample_ns: 17.6

  isolation:
    radii: [0.30, 0.40]
    truth:
      signal_radius: 0.30
      max_et_gev: 4.0
      self_removal_radius: 0.001

# -----------------------------------------------------------------------------
# p+p reconstruction
# -----------------------------------------------------------------------------

pp:
  shower_shape_tower_min_energy_gev: 0.070

  isolation:
    # Topological-cluster cone ET minus candidate ET once; the raw tower
    # cones are stored beside it.
    method: topocluster

  jets:
    views:
      - {radius: 0.20, view: pp, raw_node: AntiKt_Tower_r02_RAW, corrected_node: AntiKt_Tower_r02, truth_node: AntiKt_Truth_r02}
      - {radius: 0.30, view: pp, raw_node: AntiKt_Tower_r03_RAW, corrected_node: AntiKt_Tower_r03, truth_node: AntiKt_Truth_r03}
      - {radius: 0.40, view: pp, raw_node: AntiKt_Tower_r04_RAW, corrected_node: AntiKt_Tower_r04, truth_node: AntiKt_Truth_r04}

# -----------------------------------------------------------------------------
# Au+Au reconstruction
# -----------------------------------------------------------------------------

auau:
  shower_shape_tower_min_energy_gev: 0.0

  isolation:
    # Underlying-event subtracted tower cones; the raw cones are stored
    # beside them.
    method: sub1

  centrality:
    analysis_bin_edges_percent: [0, 20, 50, 80]

    data:
      reconstruct: true
      # local: run-bound frozen payloads pinned below or in `runs`.
      # cdb:   the conditions database resolves them.
      source: local
      calibration_set: sam_fit_20260913_v1
      calibration_manifest_sha256: 4a11e0e10ae9b82062325c3275679935da2259f4c91f796950a6b5ddd2e1501c
      require_own_run_payload: true
      # Resolved per run by the job; the entries below are the defaults the
      # per-run table in `runs` overrides.
      payload_run: null
      divisions: {path: null, sha256: null}
      run_scale: {path: null, sha256: null}
      vertex_scale: {path: null, sha256: null}
      # Only the qualified run-68144 fallback is admitted, with pinned
      # qualification evidence.
      fallback_evidence_sha256: null

    # Per-run payload table, filled by the job packet:
    # runs:
    #   "65360":
    #     payload_run: 65360
    #     divisions:    {path: ..., sha256: ...}
    #     run_scale:    {path: ..., sha256: ...}
    #     vertex_scale: {path: ..., sha256: ...}
    runs: {}

  cemc_status:
    # Validate the paired input's tower status against the bad-tower map the
    # original calorimeter file was reconstructed with.
    validate_paired_input_status: true
    # Exact original calorimeter file of this job, supplied by the job packet.
    original_calorimeter_input: null
    # A missing saved map may be recovered only from a pinned run-specific
    # payload that the job packet supplies.
    allow_missing_status_recovery: false
    recovery_payload: {path: null, sha256: null}

  background_subtraction:
    retower_cemc: {enabled: true, fraction_cut: 0.5}
    seed_jets: {radius: 0.20, raw_node: AntiKt_TowerInfo_HIRecoSeedsRaw_r02}
    iteration_1: {output_background_node: TowerInfoBackground_Sub1, seed_type: raw, seed_jet_D: 3}
    iteration_2: {output_background_node: TowerInfoBackground_Sub2, seed_type: subtracted, seed_pt_min_gev: 7.0}
    # 0 no flow, 1 psi2 from the calorimeter, 2 from HIJING, 3 from the sEPD.
    # The observed reference-production data packet ran with 0.
    flow_modulation: 0

  jets:
    views:
      - {radius: 0.20, view: auau_nosub, raw_node: AntiKt_Tower_r02_NoSub_RAW, corrected_node: AntiKt_Tower_r02_NoSub, truth_node: AntiKt_Truth_r02}
      - {radius: 0.30, view: auau_nosub, raw_node: AntiKt_Tower_r03_NoSub_RAW, corrected_node: AntiKt_Tower_r03_NoSub, truth_node: AntiKt_Truth_r03}
      - {radius: 0.40, view: auau_nosub, raw_node: AntiKt_Tower_r04_NoSub_RAW, corrected_node: AntiKt_Tower_r04_NoSub, truth_node: AntiKt_Truth_r04}
      - {radius: 0.20, view: auau_sub1, raw_node: AntiKt_Tower_r02_Sub1_RAW, corrected_node: AntiKt_Tower_r02_Sub1, truth_node: AntiKt_Truth_r02}
      - {radius: 0.30, view: auau_sub1, raw_node: AntiKt_Tower_r03_Sub1_RAW, corrected_node: AntiKt_Tower_r03_Sub1, truth_node: AntiKt_Truth_r03}
      - {radius: 0.40, view: auau_sub1, raw_node: AntiKt_Tower_r04_Sub1_RAW, corrected_node: AntiKt_Tower_r04_Sub1, truth_node: AntiKt_Truth_r04}

# -----------------------------------------------------------------------------
# Jet capture and energy scale
# -----------------------------------------------------------------------------

jets:
  # Every finite nonnegative calibrated jet is retained; cuts are downstream.

  calibration:
    enabled: true
    # Legacy method without the electromagnetic-fraction calibration, applied
    # once from the raw collection. The common p+p v6 payload is used for
    # both systems; Au+Au inputs are already underlying-event subtracted.
    cdb_key: JES_Calib_Default
    use_em_fraction_calibration: false
    expected_payload_sha256: 76a8788fdb4e0b3859d01361f884e295ea609bb8c1cc188105389214db2de27d

  matching:
    max_delta_r: 0.30

# -----------------------------------------------------------------------------
# Production profiles. The invocation selects exactly one.
# -----------------------------------------------------------------------------

profiles:

  pp_data:
    system: pp
    data_kind: data
    simulation_role: none
    dataset_token: isPP
    input_mode: reconstructed_dst
    cdb_global_tag: null  # requires exact reviewed release/run binding
    truth_jets_mode: none

  pp_photon_sim:
    system: pp
    data_kind: simulation
    simulation_role: photon_jet
    dataset_token: isSim
    input_mode: reconstructed_dst
    cdb_global_tag: null  # requires exact reviewed release/run binding
    truth_jets_mode: auto
    vertex_reweighting:
      enabled: true
      file: null  # bind reviewed payload and SHA256
      sha256: null
      histogram: h_w_iterative

  pp_inclusive_sim:
    system: pp
    data_kind: simulation
    simulation_role: inclusive_jet
    dataset_token: isSimInclusive
    input_mode: reconstructed_dst
    cdb_global_tag: null  # requires exact reviewed release/run binding
    truth_jets_mode: auto
    vertex_reweighting:
      enabled: true
      file: null  # bind reviewed payload and SHA256
      sha256: null
      histogram: h_w_iterative

  pp_photon_di:
    system: pp
    data_kind: simulation
    simulation_role: photon_jet
    dataset_token: isSim
    input_mode: archived_g4_only
    cdb_global_tag: MDC2
    cdb_timestamp: 28
    truth_jets_mode: dst
    historical_rng_contract:
      algorithm: phrandomseed_fifo_replay_v2
      seed_sequence: [2991264730, 4256268992, 2394322166, 874466025, 2240380304]
      expected_pedestal_sequence: 534
      forbid_reco_consts_random_seed: true

  pp_inclusive_di:
    system: pp
    data_kind: simulation
    simulation_role: inclusive_jet
    dataset_token: isSimInclusive
    input_mode: archived_g4_only
    cdb_global_tag: MDC2
    cdb_timestamp: 28
    truth_jets_mode: dst
    historical_rng_contract:
      algorithm: phrandomseed_fifo_replay_v2
      seed_sequence: [2991264730, 4256268992, 2394322166, 874466025, 2240380304]
      expected_pedestal_sequence: 534
      forbid_reco_consts_random_seed: true

  auau_data:
    system: auau
    data_kind: data
    simulation_role: none
    dataset_token: isAuAu
    input_mode: reconstructed_dst
    cdb_global_tag: null  # requires exact reviewed release/run binding
    truth_jets_mode: none
    reconstruct_centrality: true
    require_minimum_bias_classifier: true

  auau_photon_embedded:
    system: auau
    data_kind: simulation
    simulation_role: photon_jet
    dataset_token: isSimEmbedded
    input_mode: reconstructed_dst
    cdb_global_tag: null  # requires exact reviewed release/run binding
    truth_jets_mode: auto
    require_embedded_minimum_bias: false  # record observation; no producer selection

  auau_inclusive_embedded:
    system: auau
    data_kind: simulation
    simulation_role: inclusive_jet
    dataset_token: isSimEmbeddedInclusive
    input_mode: reconstructed_dst
    cdb_global_tag: null  # requires exact reviewed release/run binding
    truth_jets_mode: dst
    require_embedded_minimum_bias: false  # record observation; no producer selection

# -----------------------------------------------------------------------------
# Output tables
#
# The mandatory tables are always written. These switches govern the large
# witness tables whose final disposition is a mapping-ledger decision.
# -----------------------------------------------------------------------------

output:
  write_photon_cell_table: true
  write_isolation_constituent_table: true
  write_photon_jet_pair_table: true
