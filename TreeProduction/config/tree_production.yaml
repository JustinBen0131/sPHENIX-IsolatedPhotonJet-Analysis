# Reconstruction presets and capture policy for PhotonJetTree.
# The public command selects a profile and an exact maintained source catalogue.
# Setup.cc binds conditions, reconstruction and synchronized input streams.
# Photon-ID and isolation labels are applied by the shared final-format layer;
# reconstruction never removes candidates based on those labels.
# Missing required calibration or source bindings fail before event processing.

schema_version: 1


# -----------------------------------------------------------------------------
# Tree contract
#
# The complete resolved configuration is embedded in every output so the
# meaning of a tree does not depend on recovering this YAML file later.
# -----------------------------------------------------------------------------

contract:
  name: PhotonJetTrees
  stage: dst_to_tree
  implementation: PhotonJetTree
  embed_resolved_configuration: true
  fail_closed: true


# -----------------------------------------------------------------------------
# Runtime provenance
#
# The software release is part of the declared reconstruction environment.
# Build- and invocation-specific source/library identities are filled later by
# the build and production layers.
# -----------------------------------------------------------------------------

runtime:
  sphenix_release: ana.568

  # Filled by the build and invocation layer.
  producer_git_commit: null
  producer_source_sha256: null
  producer_library_sha256: null
  macro_sha256: null


# PPG12 relative event weights. Absolute normalization by generated exposure
# remains in the histogram/analysis package. Each period binds its own fit.
ppg12_weights:
  total_luminosity_pb_inv: 64.3718
  photon_jet:
    reference_cross_section_pb: 130.4461
    cross_sections_pb: {photon5: 146359.3, photon10: 6944.675, photon20: 130.4461}
  inclusive_jet:
    reference_cross_section_pb: 7.3113
    cross_sections_pb: {jet5: 138780000.0, jet8: 11500000.0, jet12: 1490300.0, jet20: 62623.0, jet30: 2529.8, jet40: 135.53}
  periods:
    0mrad:
      luminosity_pb_inv: 47.2076
      double_fraction: 0.224
      vertex_reweighting:
        enabled: true
        file: /sphenix/user/shuhangli/ppg12/efficiencytool/truth_vertex_reweight/output/0mrad/reweight.root
        sha256: 4c2a50fa2dd4fe6e3f8b823454f19753367876edabc9fe48164447a0d07be6b9
        histogram: h_w_iterative
    1p5mrad:
      luminosity_pb_inv: 17.1642
      double_fraction: 0.079
      vertex_reweighting:
        enabled: true
        file: /sphenix/user/shuhangli/ppg12/efficiencytool/truth_vertex_reweight/output/1p5mrad/reweight.root
        sha256: 1429442b2cce368bcc4b4fd613f706f27b9c194f1e835d800238e059c0804d4d
        histogram: h_w_iterative


# -----------------------------------------------------------------------------
# Event capture policy
#
# TreeProduction retains the producer-level event population independently of
# whether an event contains an analysis photon. This preserves the denominator
# needed for later efficiency and exposure accounting.
# -----------------------------------------------------------------------------

capture:

  # One event row per event handed to the producer, including events with no
  # photon candidate. The event population is the exposure denominator.
  retain_every_producer_encounter: true

  # Row identities are scoped to their source. Cross-file joins carry the
  # source identity.
  identity_scope: source


# -----------------------------------------------------------------------------
# Input node vocabulary
#
# These are the canonical node names PhotonJetTree reads. Production*.cc is
# responsible for creating or exposing the required nodes for the selected
# profile before the producer executes.
# -----------------------------------------------------------------------------

nodes:
  event_header: EventHeader
  gl1_packet: GL1Packet

  global_vertex_map: GlobalVertexMap
  centrality_info: CentralityInfo
  minimum_bias_info: MinimumBiasInfo

  mbd_out: MbdOut
  mbd_pmts: MbdPmtContainer
  mbd_pmts_fallback: MbdPmtContainer_data  # AuAu collaborator charge capture only

  cemc_towers: TOWERINFO_CALIB_CEMC
  ihcal_towers: TOWERINFO_CALIB_HCALIN
  ohcal_towers: TOWERINFO_CALIB_HCALOUT

  cemc_geometry: TOWERGEOM_CEMC

  truth_info: G4TruthInfo
  hepmc_event_map: PHHepMCGenEventMap


# -----------------------------------------------------------------------------
# Calorimeter reconstruction
#
# Shared reconstruction-level calorimeter settings. System-specific behavior
# is configured separately in the pp and auau sections below.
# -----------------------------------------------------------------------------

calorimeter:

  # Electromagnetic calorimeter clustering.
  cluster_builder:
    detector: CEMC
    threshold_energy_gev: 0.070
    profile:
      path: "${CALIBRATIONROOT}/EmcProfile/CEMCprof_Thresh30MeV.root"

  tower_status:

    # Simulation applies this hot-tower map from the conditions database.
    simulation_hot_map_key: CEMC_hotTowers_status

  cemc:

    # Data: pin and validate the zero-suppression cross-calibration payload
    # before the CEMC calibrator runs.
    zero_suppression_cross_calibration: true

  event_energy:

    # Event energy sums admit only towers the calibration marked good. The
    # choice is recorded in every event.
    require_good_towers: true


# -----------------------------------------------------------------------------
# Photon reconstruction and capture
#
# The capture domain is deliberately broader than the final measurement
# selection. TreeProduction preserves reconstruction-level photon information;
# PhotonID and later stages decide how that information is selected.
# -----------------------------------------------------------------------------

photons:

  # Storage domain, not the measurement selection.
  capture_domain:
    min_et_gev: 5.0
    max_et_gev: 40.0
    max_abs_eta: 0.7

    # Reconstructed objects (photons and jets) are captured only when the
    # reconstructed vertex is valid and |z| is below this value. The event
    # row is retained either way. Analysis vertex windows are narrower and
    # live in the TreeToHists selection profiles.
    object_vertex_abs_z_max_cm: 60.0

  # Reconstruction input/output nodes used by the photon builder and isolation.
  source_cluster_node: CLUSTERINFO_CEMC
  output_photon_node: PHOTONCLUSTER_CEMC
  topocluster_node: TOPOCLUSTER_ALLCALO

  builder:

    # Threshold of the upstream photon builder. Kept equal to the storage
    # domain so that no candidate the tree could store is dropped upstream.
    # min_et_gev comes from capture_domain; do not duplicate it here.

    # Native reconstruction and storage use the same broad reconstructed-vertex
    # domain. This is not the narrower downstream analysis vertex selection.
    use_vertex_cut: true
    vertex_cut_cm: 60.0

  # Named models the builder evaluates on every candidate. The PPG12 NPB
  # score is the fixed preselection score of the historical production (never
  # retrained); the digest is the production packet's dependency pin.
  models:
    - score_name: npb_score
      file: /sphenix/user/shuhangli/ppg12/FunWithxgboost/npb_models/npb_score_split_tmva.root
      sha256: d6086dadac534013cda15cdfb69c1683776d3456d9e439903589653e8ac19eab
      features: [cluster_Et, cluster_Eta, vertexz, e11_over_e33, e32_over_e35, e11_over_e22, e11_over_e13,
                 e11_over_e15, e11_over_e17, e11_over_e31, e11_over_e51, e11_over_e71, e22_over_e33,
                 e22_over_e35, e22_over_e37, e22_over_e53, cluster_weta_cogx, cluster_wphi_cogx,
                 cluster_et1, cluster_et2, cluster_et3, cluster_et4, cluster_w32, cluster_w52, cluster_w72]
      min_et: 6.0
      max_et: 40.0
      max_abs_eta: 0.7
      unevaluated_score: -1.0
      configured_cut: 0.5

  # The active photon preselection recorded as pho_presel_active: PPG12's
  # newPPG12 definition, the NPB score above its cut plus the common shower
  # cuts (open intervals, no weta cut). Nothing is removed in production.
  preselection:
    variant: newPPG12
    npb_score: npb_score
    et1: [0.6, 1.0]
    e11_over_e33_max: 0.98
    e32_over_e35: [0.8, 1.0]

  shower_shapes:

    # Definitions evaluated for every candidate. H = rectangular sums over the
    # full good-tower 7x7 grid, second moments over cluster-owned towers; the
    # number is the tower energy floor in MeV. G uses grid moments, O uses
    # owned sums and moments, and R uses RawCluster-map energies. One generic
    # builder calculation supplies the seven retained feature views.
    definitions: [H70, H0, G70, G0, O70, O0, R70]

  timing:
    sample_ns: 17.6

  isolation:

    # Both commonly used cone radii are retained as measured observables.
    # Isolated/non-isolated working points are applied later by PhotonID.
    radii: [0.30, 0.40]

    truth:
      signal_radius: 0.30
      max_et_gev: 4.0
      self_removal_radius: 0.001


# -----------------------------------------------------------------------------
# p+p reconstruction
#
# Defines the p+p realization of shower reconstruction, reconstructed isolation,
# and the retained jet collections.
# -----------------------------------------------------------------------------

pp:

  shower_shape_tower_min_energy_gev: 0.070

  isolation:

    # Topological-cluster cone ET minus candidate ET once; the raw tower
    # cones are stored beside it.
    method: topocluster

    # Historical PPG12 sliding working point recorded with each cone
    # (isow_*): threshold = intercept + slope * photon ET, sideband above it.
    # The nominal pp isolation class reads these witnesses at R = 0.4.
    witness:
      r03: {intercept_gev: 0.490, slope: 0.037, sideband_gap_gev: 0.8}
      r04: {intercept_gev: 0.490, slope: 0.037, sideband_gap_gev: 0.8}

  photon_id:

    # The frozen PPG12 classifier, evaluated by the builder on the primary
    # H70 view exactly as the historical producer did (pho_prodbdt_*). Its
    # file, digest and input order come from PhotonID/models/PP/<model>; the
    # nominal pho_bdt_score copies this producer score after a recompute check.
    production_score:
      model: nominal
      score_name: tight_bdt_score
      min_et: 7.0               # the package domain; -1 is written below it
      unevaluated_score: -1.0
      validated_et: [15.0, 35.0]
      # Historical per-ET working points of this model, recorded as witnesses
      # inside the validated domain. The photon-ID regions come from PhotonID.
      working_points:
        et_edges: [15, 17, 19, 21, 23, 25, 28, 32, 35]
        wp70: [0.79682856798172, 0.766527533531189, 0.764809787273407, 0.7529897093772888,
               0.7708977460861206, 0.8068315982818604, 0.8892104029655457, 0.972591757774353]
        wp80: [0.7195994257926941, 0.682415783405304, 0.6793394684791565, 0.6720289587974548,
               0.6960929036140442, 0.7344872951507568, 0.8287723064422607, 0.9486955404281616]
        wp90: [0.5593066215515137, 0.5007686018943787, 0.5124438405036926, 0.5229008793830872,
               0.5534335374832153, 0.5945547223091125, 0.6987603907585144, 0.8794801831245422]

  jets:

    # Raw and JES-corrected reconstructed collections are retained for all three
    # radii, together with the same-radius truth collections in simulation.
    views:
      - {radius: 0.20, view: pp, raw_node: AntiKt_Tower_r02_RAW, corrected_node: AntiKt_Tower_r02, truth_node: AntiKt_Truth_r02}
      - {radius: 0.30, view: pp, raw_node: AntiKt_Tower_r03_RAW, corrected_node: AntiKt_Tower_r03, truth_node: AntiKt_Truth_r03}
      - {radius: 0.40, view: pp, raw_node: AntiKt_Tower_r04_RAW, corrected_node: AntiKt_Tower_r04, truth_node: AntiKt_Truth_r04}


# -----------------------------------------------------------------------------
# Au+Au reconstruction
#
# Au+Au retains the additional state required to reproduce centrality,
# underlying-event subtraction, CEMC status handling, SUB1 isolation, and both
# subtracted and unsubtracted jet views.
# -----------------------------------------------------------------------------

auau:

  # Same H70 reconstruction as pp. H0 is the additional configured view above.
  # This shower floor never imposes an AuAu isolation constituent energy cut.
  shower_shape_tower_min_energy_gev: 0.070

  isolation:

    # Underlying-event subtracted tower cones; the raw cones are stored
    # beside them.
    method: sub1

    # Historical working point recorded with each SUB1 cone (isow_*): a line
    # in the truncated integer centrality inside centrality_range, the
    # photon-ET fallback line otherwise. The nominal Au+Au isolation class
    # uses the pinned TreeToHists freeze, not these thresholds.
    witness:
      centrality_range: [0, 80]
      r03: {intercept_gev: 5.97, slope: -0.0507, sideband_gap_gev: 0.0}
      r04: {intercept_gev: 7.57, slope: -0.0658, sideband_gap_gev: 0.0}
      fallback: {intercept_gev: 0.081, slope: 0.019, sideband_gap_gev: 0.8}

  # Centrality is reconstructed for Au+Au DATA from explicitly bound run-level
  # payloads. The native centile remains stored; these coarse edges provide the
  # production-level analysis-bin vocabulary.
  centrality:
    analysis_bin_edges_percent: [0, 20, 50, 80]

    data:
      reconstruct: true

      # local: run-bound frozen payloads pinned below or in `runs`.
      # cdb:   the conditions database resolves them.
      source: local

      calibration_set: sam_fit_20260913_v1
      calibration_manifest_sha256: 4a11e0e10ae9b82062325c3275679935da2259f4c91f796950a6b5ddd2e1501c
      require_own_run_payload: true

      # Resolved per run by the job; the entries below are the defaults the
      # per-run table in `runs` overrides.
      payload_run: null
      divisions: {path: null, sha256: null}
      run_scale: {path: null, sha256: null}
      vertex_scale: {path: null, sha256: null}

      # Only the qualified run-68144 fallback is admitted, with pinned
      # qualification evidence.
      fallback_evidence_sha256: null

    # Per-run payload table, filled by the job packet:
    # runs:
    #   "65360":
    #     payload_run: 65360
    #     divisions:    {path: ..., sha256: ...}
    #     run_scale:    {path: ..., sha256: ...}
    #     vertex_scale: {path: ..., sha256: ...}
    runs: {}

  # CEMC status must remain tied to the calibration state of the original paired
  # calorimeter input. Missing historical status may be restored only through an
  # explicitly authorized and hash-bound recovery payload.
  cemc_status:

    # Validate the paired input's tower status against the bad-tower map the
    # original calorimeter file was reconstructed with.
    validate_paired_input_status: true

    # Exact original calorimeter file of this job, supplied by the job packet.
    original_calorimeter_input: null

    # A missing saved map may be recovered only from a pinned run-specific
    # payload that the job packet supplies.
    allow_missing_status_recovery: false
    recovery_payload: {path: null, sha256: null}

  # Two-pass heavy-ion underlying-event reconstruction. The resulting SUB1/SUB2
  # state is used by the Au+Au isolation and jet paths and retained sufficiently
  # for downstream auditing.
  background_subtraction:
    retower_cemc: {enabled: true, fraction_cut: 0.5}
    seed_jets: {radius: 0.20, raw_node: AntiKt_TowerInfo_HIRecoSeedsRaw_r02}
    iteration_1: {output_background_node: TowerInfoBackground_Sub1, seed_type: raw, seed_jet_D: 3}
    iteration_2: {output_background_node: TowerInfoBackground_Sub2, seed_type: subtracted, seed_pt_min_gev: 7.0}

    # 0 no flow, 1 psi2 from the calorimeter, 2 from HIJING, 3 from the sEPD.
    # The observed reference-production data packet ran with 0.
    flow_modulation: 0

  jets:

    # Retain both unsubtracted and SUB1 reconstructed jet views. The final
    # measurement may choose one, but TreeProduction preserves both physical
    # representations so that choice remains downstream.
    views:
      - {radius: 0.20, view: auau_nosub, raw_node: AntiKt_Tower_r02_NoSub_RAW, corrected_node: AntiKt_Tower_r02_NoSub, truth_node: AntiKt_Truth_r02}
      - {radius: 0.30, view: auau_nosub, raw_node: AntiKt_Tower_r03_NoSub_RAW, corrected_node: AntiKt_Tower_r03_NoSub, truth_node: AntiKt_Truth_r03}
      - {radius: 0.40, view: auau_nosub, raw_node: AntiKt_Tower_r04_NoSub_RAW, corrected_node: AntiKt_Tower_r04_NoSub, truth_node: AntiKt_Truth_r04}
      - {radius: 0.20, view: auau_sub1, raw_node: AntiKt_Tower_r02_Sub1_RAW, corrected_node: AntiKt_Tower_r02_Sub1, truth_node: AntiKt_Truth_r02}
      - {radius: 0.30, view: auau_sub1, raw_node: AntiKt_Tower_r03_Sub1_RAW, corrected_node: AntiKt_Tower_r03_Sub1, truth_node: AntiKt_Truth_r03}
      - {radius: 0.40, view: auau_sub1, raw_node: AntiKt_Tower_r04_Sub1_RAW, corrected_node: AntiKt_Tower_r04_Sub1, truth_node: AntiKt_Truth_r04}


# -----------------------------------------------------------------------------
# Jet capture, calibration, and truth matching
#
# TreeProduction retains the broad reconstructed jet population. Recoil pT,
# eta, and delta-phi requirements are measurement selections and remain
# downstream.
#
# JES is applied once by the reconstruction layer. PhotonJetTree records both
# the raw and corrected jet quantities together with the calibration identity.
# -----------------------------------------------------------------------------

jets:

  # Every finite nonnegative calibrated jet is retained; cuts are downstream.

  calibration:
    enabled: true

    # Legacy method without the electromagnetic-fraction calibration, applied
    # once from the raw collection. The common p+p v6 payload is used for
    # both systems; Au+Au inputs are already underlying-event subtracted.
    cdb_key: JES_Calib_Default
    use_em_fraction_calibration: false
    expected_payload_sha256: 76a8788fdb4e0b3859d01361f884e295ea609bb8c1cc188105389214db2de27d

  # Same-radius reconstructed/truth jet candidates are considered within this
  # geometric distance before deterministic one-to-one assignment.
  matching:
    max_delta_r: 0.30


# -----------------------------------------------------------------------------
# Production profiles
#
# The invocation selects exactly one profile. Profiles describe production mode,
# not final analysis selection:
#
#   system             p+p or Au+Au
#   data_kind          DATA or simulation
#   simulation_role    photon+jet, inclusive-jet, or none
#   input_mode         reconstructed DST or archived Geant4-only input
#   cdb context        conditions environment required by that mode
#   truth_jets_mode    read, build, automatically resolve, or none
#
# Profile-specific reconstruction requirements are declared only where needed.
# -----------------------------------------------------------------------------

profiles:

  # p+p DATA
  pp_data:
    system: pp
    data_kind: data
    simulation_role: none
    dataset_token: isPP
    input_mode: reconstructed_dst
    cdb_global_tag: newcdbtag  # historical producer tag (ana.568 macro default, no saved override)
    truth_jets_mode: none


  # p+p photon+jet simulation
  pp_photon_sim:
    system: pp
    data_kind: simulation
    simulation_role: photon_jet
    dataset_token: isSim
    input_mode: reconstructed_dst
    cdb_global_tag: newcdbtag  # historical producer tag (ana.568 macro default, no saved override)
    truth_jets_mode: auto

  # p+p inclusive-jet simulation
  pp_inclusive_sim:
    system: pp
    data_kind: simulation
    simulation_role: inclusive_jet
    dataset_token: isSimInclusive
    input_mode: reconstructed_dst
    cdb_global_tag: newcdbtag  # historical producer tag (ana.568 macro default, no saved override)
    truth_jets_mode: auto

  # Archived p+p photon+jet double-interaction simulation
  #
  # These Geant4-only inputs depend on the original random-number consumption
  # sequence. The archived donor is reproduced by replaying the exact FIFO seed
  # contract rather than choosing a new production seed.
  pp_photon_di:
    system: pp
    data_kind: simulation
    simulation_role: photon_jet
    dataset_token: isSim
    input_mode: archived_g4_only
    cdb_global_tag: MDC2
    cdb_timestamp: 28
    truth_jets_mode: dst

    historical_rng_contract:
      algorithm: phrandomseed_fifo_replay_v2
      seed_sequence: [2991264730, 4256268992, 2394322166, 874466025, 2240380304]
      expected_pedestal_sequence: 534
      forbid_reco_consts_random_seed: true


  # Archived p+p inclusive-jet double-interaction simulation
  pp_inclusive_di:
    system: pp
    data_kind: simulation
    simulation_role: inclusive_jet
    dataset_token: isSimInclusive
    input_mode: archived_g4_only
    cdb_global_tag: MDC2
    cdb_timestamp: 28
    truth_jets_mode: dst

    historical_rng_contract:
      algorithm: phrandomseed_fifo_replay_v2
      seed_sequence: [2991264730, 4256268992, 2394322166, 874466025, 2240380304]
      expected_pedestal_sequence: 534
      forbid_reco_consts_random_seed: true


  # Au+Au DATA
  auau_data:
    system: auau
    data_kind: data
    simulation_role: none
    dataset_token: isAuAu
    input_mode: reconstructed_dst
    cdb_global_tag: newcdbtag  # historical producer tag (ana.568 macro default, no saved override)
    truth_jets_mode: none
    reconstruct_centrality: true
    require_minimum_bias_classifier: true


  # Embedded Au+Au photon+jet simulation
  auau_photon_embedded:
    system: auau
    data_kind: simulation
    simulation_role: photon_jet
    dataset_token: isSimEmbedded
    input_mode: reconstructed_dst
    cdb_global_tag: newcdbtag  # historical producer tag (ana.568 macro default, no saved override)
    truth_jets_mode: auto

    require_embedded_minimum_bias: false  # record observation; no producer selection


  # Embedded Au+Au inclusive-jet simulation
  auau_inclusive_embedded:
    system: auau
    data_kind: simulation
    simulation_role: inclusive_jet
    dataset_token: isSimEmbeddedInclusive
    input_mode: reconstructed_dst
    cdb_global_tag: newcdbtag  # historical producer tag (ana.568 macro default, no saved override)
    truth_jets_mode: dst

    require_embedded_minimum_bias: false  # record observation; no producer selection


# -----------------------------------------------------------------------------
# Optional high-volume witness tables
#
# Mandatory canonical tables are always written. These switches control large
# reconstruction-level witness tables whose permanent disposition remains an
# open field-mapping decision of the final layout.
#
# They remain enabled until equivalence work demonstrates that dropping them
# would not remove information needed to reconstruct downstream quantities:
#
#   PhotonCells
#     cell-level calorimeter evidence for reconstructed photon showers
#
#   IsolationConstituents
#     individual objects contributing to reconstructed isolation cones
#
#   PhotonJetPairs
#     explicit photon-jet pair witnesses; potentially derivable later from the
#     retained photon and jet collections once exact equivalence is established
# -----------------------------------------------------------------------------

output:
  write_photon_cell_table: true
  write_isolation_constituent_table: true
  write_photon_jet_pair_table: true
