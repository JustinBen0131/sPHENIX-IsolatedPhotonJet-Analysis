# PhotonID owns ordered features, application domains, model files and recipes.
# Five separate slots, all UNBOUND. Proposed features need model parity review.
# File and SHA256 bind together. CDB keys describe separately resolved imports;
# Python inference never guesses or silently downloads a model.
# Training needs the complete approved recipe enumerated in train.py.

---
registry_version: 1
models:
  ppg12_npb_reference:
    description: 'PPG12 non-prompt-background (NPB) reference classifier as invoked
      by the historical production, 25 ordered inputs from the H70 shower view. Kept
      as the reference point for p+p photon identification; it is not the tight-photon
      model of this analysis.

'
    system: pp
    shower_definition: H70
    features:
    - cluster_Et
    - cluster_Eta
    - vertexz
    - e11_over_e33
    - e32_over_e35
    - e11_over_e22
    - e11_over_e13
    - e11_over_e15
    - e11_over_e17
    - e11_over_e31
    - e11_over_e51
    - e11_over_e71
    - e22_over_e33
    - e22_over_e35
    - e22_over_e37
    - e22_over_e53
    - cluster_weta_cogx
    - cluster_wphi_cogx
    - cluster_et1
    - cluster_et2
    - cluster_et3
    - cluster_et4
    - cluster_w32
    - cluster_w52
    - cluster_w72
    ratio_policy: builder_zero
    domain:
      min_et_gev: 5.0
      max_et_gev: 40.0
      max_abs_eta: 0.7
    format: tmva_rbdt
    model_file: 
    model_sha256: 
    cdb_key: 
    score_direction: higher_is_signal
    training_manifest: 
    status: unresolved
    binding_evidence: 
