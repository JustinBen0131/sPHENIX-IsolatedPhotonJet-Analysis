# One selection for spectra, event tables, QA and the simulation response.
# Copy this file anywhere to make a variation. Omitted overrides use the packages.
version: 1
name: nominal

# Optional replacement packages; explicit paths are relative to this YAML.
# photon_id_package: /path/to/new_photon_id_freeze.json
# auau_isolation_package: /path/to/new_isolation_freeze.json

systems:
  pp:
    # Change these only to use an already augmented, provenance-bound score.
    score_branch: pho_bdt_score
    state_branch: pho_bdt_state
    score_metadata: meta/photon_id
    # Working-point lines use photon ET (GeV). Example override:
    # non_tight_low: {intercept: 0.7333333333333333, slope: -0.01333333333333333}
    # tight and non_tight_high accept the same form.
    # Isolation defaults to the PPG12 R=0.4 stored witness and thresholds.
    # isolation: {sideband_gap_gev: 0.0}
  auau:
    # The nominal stream is selected by exact name in each source run.
    data_trigger: photon12
    score_branch: pho_bdt_score
    state_branch: pho_bdt_state
    score_metadata: meta/photon_id
    # Working-point lines use centrality (%). Constant cuts have slope: 0.
    # non_tight_low: {intercept: 0.2, slope: 0.0}
    # Isolation uses the pinned R=0.3, 80% package. Example sideband change:
    # isolation: {sideband_gap_gev: 0.4}
