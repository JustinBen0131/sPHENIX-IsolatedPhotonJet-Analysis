# Produced eventTree ROOT files or published tree-group directories.
# Paths are relative to this YAML file. DST .list files belong to TreeProduction.
samples:
  - system: PP
    name: data
    family: data
    files:
      - /path/to/pp_eventTree.root
  - system: AuAu
    name: data
    family: data
    groups:
      - /path/to/published_auau_group

# Add simulation samples to the same sequence. Example:
#   - system: PP
#     name: run28_photonjet20
#     family: photonjet
#     source_sample: run28_photonjet20
#     files: [/path/to/pp_photonjet20.root]
#     normalization:
#       source_factor: cross_section_over_generated
#       cross_section_pb: <qualified cross section in pb>
#       generated_events: <qualified generated-event count>
# Optional population_sources sets the expected source count; omitted means
# UNKNOWN coverage. Simulation families are photonjet and inclusivejet.
# Other supported normalization rules are family_reference (with reference and
# a top-level reference_cross_section_pb mapping) and auau_embedded_stitching.
#
# AuAu simulation additionally supplies these qualified fields per sample:
#     centrality_weights: [<16 positive weights>]
#     centrality_evidence: <derivation record>
#     centrality_data_trigger: "Photon 12 GeV + MBD NS >= 2, vtx < 150 cm"
#     vertex_reweighting:
#       path: /path/to/vertex_weights.root
#       sha256: <file sha256>
#       histogram: <histogram name>
#       coordinate: truth_vtx_z
#       selection_sha256: <resolved selection sha256>
#       centrality_weights_sha256: <weights digest from the derivation>
#       evidence: <fit qualification record>
