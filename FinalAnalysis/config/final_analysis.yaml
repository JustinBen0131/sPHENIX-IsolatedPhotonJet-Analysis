# The final measurement: every setting of the per-photon xJgamma results of the new production, as
# FinalAnalysis/src/analysis.py takes them. The settled values are the locked
# analysis definitions. A `null` is a number of the new production or an open choice: the run cannot start until it is
# filled.
#
# Run per entry of `systems`: pp, and the Au+Au classes auau_cent0_20, auau_cent20_50, auau_cent50_80 (each a class
# entry of the collision system auau with its own centrality slices and seeds).
#
# Units: GeV, cm, percent for centrality, pb for cross sections.

analysis: final_the352_v1
profile: nominal               # TreeToHists selection profile of the data and simulation files

measurement:
  # Identical pp/Au+Au bins inside 15-35 GeV on the native 1 GeV grid, under/overflow >= 2 GeV (15-17, 33-35). The
  # The schema-10 layout is a starting candidate; src/internal/scan.py records alternatives under the same rule.
  photon_pt_edges_gev: [17.0, 23.0, 33.0]
  # The ATLAS-like edges of the live IAN (the histogram package keeps the 24-bin union grid, which contains them).
  xj_edges: [0.0, 0.2, 0.24, 0.29, 0.35, 0.41, 0.5, 0.6, 0.72, 0.86, 1.03, 1.24, 1.49, 1.78, 2.14, 3.0]
  # The live IAN's reported range on these edges (0.35 ... 1.49). (The schema-10 reference reported [0.3, 1.5) on its
  # own edges.)
  reported_xj: [0.35, 1.49]
  jet_pt_min_gev: 5.0          # anti-kT R = 0.4, pT > 5 GeV, dphi > 7pi/8 (locked)

response:
  # response axes of the unfolding: the measurement edges with their under/overflow, inside the migration range; the
  # production response is filled on 1 GeV grids and sums exactly onto these (TreeToHists package.simulation_sums)
  reco_ptgamma_edges: [10.0, 15.0, 17.0, 23.0, 33.0, 35.0, 40.0]
  truth_ptgamma_edges: [5.0, 10.0, 15.0, 17.0, 23.0, 33.0, 35.0, 40.0]
  # The new production's weights (16 values, 5% slices of 0-80%): TreeToHists/centrality.py on the FillPhotonQA
  # outputs of the Au+Au runs and the simulation centrality sums. Data target as in the schema-10 package (THE-356): scaled
  # Photon 10 GeV + MBD NS >= 2 (vtx < 150 cm), minimum-bias classified, |z| < 10 cm (the centrality.py default).
  auau_centrality_weights: null

prior:
  form: exp1
  fake_model: scaled
  fit_range: all
  power: 1.0                   # the unfolding starts from w^power of the fitted prior; 0.5 and 1.5 are the ATLAS bracket

uncertainty:
  data_toys: 2000
  response_toys: 1000
  response_seed: 35200001

iteration_scan:                # the frozen iteration rule (the systems below use `scan`)
  data_toys: 2000
  data_seed: 35200002
  response_toys: 1000
  response_seed: 35200001

closure:
  toys: 200
  seeds: {pp: 35200200, auau_cent0_20: 35200201, auau_cent20_50: 35200202, auau_cent50_80: 35200203}

unfolding_closure:
  toys: 300
  seeds: {pp: 35200300, auau_cent0_20: 35200301, auau_cent20_50: 35200302, auau_cent50_80: 35200303}

# Sample normalisation, pb per generated event (TreeToHists package.sample_weight): the new production's numbers, bound
# to its source manifests (TreeToHists/config/samples.yaml rules). Old production numbers never carry over.
reference_cross_section_pb:
  pp_photon_signal: null
samples:
  pp_photon5: {system: pp, kind: simulation, family: photonjet, source_factor: family_reference,
               reference: pp_photon_signal, generated_events: null}
  pp_photon10: {system: pp, kind: simulation, family: photonjet, source_factor: family_reference,
                reference: pp_photon_signal, generated_events: null}
  pp_photon20: {system: pp, kind: simulation, family: photonjet, source_factor: family_reference,
                reference: pp_photon_signal, generated_events: null}
  auau_photon12: {system: auau, kind: simulation, family: photonjet, source_factor: cross_section_over_generated,
                  cross_section_pb: null, generated_events: null}
  auau_photon20: {system: auau, kind: simulation, family: photonjet, source_factor: cross_section_over_generated,
                  cross_section_pb: null, generated_events: null}

# Optional per photon-pT bin keys of `corrections`, used by systematic runs (one value per measurement bin; absent is the
# nominal bit for bit): background_correlation (R_bkg), purity_scale, efficiency_scale (data/simulation photon ID and
# isolation efficiency). The ABCD sideband variants are TreeToHists profiles (`profile: nominal:sideband_gap=0`, ...).
# Every system: iterations by the frozen rule; the data-driven combinatoric estimate (PPG08/PPG14 flow-shaped
# sideband fit, refitted per whole-event bootstrap toy) with window occupancy `none` (`simulation` is the
# alternative). Still open: the pp simulation mix (single interaction as validated, or PPG12's double-interaction mix).
systems:
  pp:
    class: all
    centrality_slices: [-1]
    samples: [pp_photon5, pp_photon10, pp_photon20]
    iterations: {pairs: scan, photons: scan}
    data_toys: {model: event_bootstrap, seed: 35200010}
    corrections:
      subtract_combinatoric: true
      purity_strategy: per_pt
      combinatoric: {method: data_dphi, shape: flow, scope: pt, occupancy: none}
  auau_cent0_20:
    system: auau
    class: cent0_20
    centrality_slices: [0, 1, 2, 3]
    samples: [auau_photon12, auau_photon20]
    iterations: {pairs: scan, photons: scan}
    data_toys: {model: event_bootstrap, seed: 35200021}
    corrections:
      subtract_combinatoric: true
      purity_strategy: per_pt
      combinatoric: {method: data_dphi, shape: flow, scope: pt, occupancy: none}
  auau_cent20_50:
    system: auau
    class: cent20_50
    centrality_slices: [4, 5, 6, 7, 8, 9]
    samples: [auau_photon12, auau_photon20]
    iterations: {pairs: scan, photons: scan}
    data_toys: {model: event_bootstrap, seed: 35200022}
    corrections:
      subtract_combinatoric: true
      purity_strategy: per_pt
      combinatoric: {method: data_dphi, shape: flow, scope: pt, occupancy: none}
  auau_cent50_80:
    system: auau
    class: cent50_80
    centrality_slices: [10, 11, 12, 13, 14, 15]
    samples: [auau_photon12, auau_photon20]
    iterations: {pairs: scan, photons: scan}
    data_toys: {model: event_bootstrap, seed: 35200023}
    corrections:
      subtract_combinatoric: true
      purity_strategy: per_pt
      combinatoric: {method: data_dphi, shape: flow, scope: pt, occupancy: none}
