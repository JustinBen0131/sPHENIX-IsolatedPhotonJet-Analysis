# FinalAnalysis settings: every physics choice of the per-photon xJgamma measurement.
# YAML format. Copy this file to make a variation; the code never chooses a value itself.
# Units: GeV for photon ET and pT; xJ is dimensionless.

Analysis:
  Name: final_the358_v1
Input:

  # The TreeToHists histogram collection (<Package>/data.root, <Package>/photonjet.root) and the results file.
  # Set both for the run; the results file must not exist yet.
  Directory: /path/to/TreeToHists/collection
Output:
  Results: /path/to/results/results.root
  QA: /path/to/results/qa.root
Recoil:
  Jet: jet5  # package slot jet<GeV>: anti-kT R = 0.4 recoil jets above 5 GeV
Measurement:

  # xJ bins (the IAN's ATLAS-like bins; the packages keep the 24-bin union grid that contains them). The reported range
  # starts where the distribution is fully populated: the first xJ edge at or above (jet threshold)/(lowest photon edge),
  # derived for every result, never typed in (5/17 -> 0.35 here). Only its upper edge is a setting.
  XjEdges: [0, 0.2, 0.24, 0.29, 0.35, 0.41, 0.5, 0.6, 0.72, 0.86, 1.03, 1.24, 1.49, 1.78, 2.14, 3.0]
  ReportedXjMax: 1.49
Association:

  # Optional: the reconstructed-to-truth association figure (IAN Figure 25) on finer bins than the results', for the
  # listed results: saved as association_pairs_A, association_pairs_reco_simulation and
  # association_pairs_reco_matched_simulation. Both lists are unions of the package bins, the xJ list over the package
  # range. Leave the block out and the figure is drawn on the result's own bins.
  Systems: [pp]
  PhotonEdges: [16, 18, 20, 22, 24, 26, 35]
  XjEdges: [0, 0.2, 0.3, 0.41, 0.5, 0.6, 0.7, 0.8, 0.9, 1.0, 1.1, 1.25, 1.5, 1.78, 2.0, 3.0]
Uncertainty:

  # Statistical uncertainty: data toys, a Poisson(1) multiplier per event of the DATA event records (event_bootstrap), so
  # a photon and its recoil jets move together; poisson draws every histogram bin independently.
  DataToys: 2000
  Seed: 35200002
  DataToyModel: event_bootstrap
  # The response's statistical uncertainty: toys that resample the simulated sources with replacement within each
  # sample; every toy corrects, refits and unfolds the data again. The result's uncertainty is the data and response
  # central-68% half widths in quadrature.
  ResponseToys: 1000
  ResponseSeed: 35200001
Closure:
  # The estimator closure: the simulation measured by the estimator of the data, with every source and in source-disjoint
  # halves (A_to_B, B_to_A), its error from resampling the simulated sources (0 toys: no closure).
  Toys: 200
  Seed: 35200200
IterationRule:

  # The iteration scan of every result: for each k the statistical terms, the change from k - 1 and their quadrature
  # sum Q_k, on its own data and response toys. It is the stability figure, and it gives the iterations of every
  # unfolding set to `scan` below: the k with the smallest Q_k (FinalAnalysis/src/Unfolding.cc). A number instead of
  # `scan` fixes the iterations. The k below and above the nominal is the systematic.
  DataToys: 2000
  DataSeed: 35200002
  ResponseToys: 1000
  ResponseSeed: 35200001

  # The prior of the joint scan: fitted, the prior the measurement itself starts from (the simulated truth
  # reweighted to the data, Prior.Form and Prior.Fraction), or simulation, the unreweighted simulated truth.
  Prior: fitted
Unfolding:
  ScanIterations: 8  # iterations shown in the stability figures
Prior:

  # The joint unfolding's prior: the simulated truth reweighted in xJ, w = exp(t0 + t1 (xJ - 0.8) [+ t2 (xJ - 0.8)^2]),
  # fitted to the corrected data with the data-toy covariance (exp1, exp2, or simulation for no reweighting). Detector
  # fakes follow the reweighted signal (scaled) or stay fixed; the fit uses all measured bins or the reported ones. The
  # unfolding starts from 1 + Fraction (w - 1): 1 nominal; 0.5, half the reweighting, is the prior systematic (PPG14).
  Form: exp1
  FakeModel: scaled
  FitRange: all
  Fraction: 1
Combinatoric:

  # Combinatoric jets: data_dphi measures their level in the data, the jets in the Delta-phi sideband per photon and xJ
  # bin, and removes them before the purity correction; simulation subtracts the embedded-simulation template per photon.
  # Shape simulation (nominal) carries the sideband level into the recoil window with the simulated ratio of the
  # combinatoric jets in the window to all jets in the sideband, which holds the depletion under the recoil jet.
  # Shape flow or flat take the sideband density under the recoil peak (a flow shape fitted at |Delta eta| > 0.8, or a
  # constant), with Scope pt (one shape per photon bin) or pt_xj. Sideband: two Delta-phi bin edges [rad] (0.8, 2.5 or
  # multiples of pi/32, to three decimals); its range is varied as a systematic.
  Method: data_dphi
  Shape: simulation
  Sideband: [0.8, 2.5]
  Scope: pt
QA:
  # QA projections and drawing windows, in GeV. TruthIsolation is consecutive low/high pairs.
  AbcdEdges: [15, 17, 19, 21, 23, 25, 35]
  Windows:
    ShowerShapes: [15, 20]
    IsolationOverlay: [14, 16]
    TruthIsolation: [15, 20, 25, 30]
    NcbScore: [16, 35]
  PP:

    # QA: the inclusive-jet samples of each package for the background QA and the purity closure (the photon samples are
    # the results' Simulation); none until the inclusive simulation is produced.
    Inclusive: none
  AuAu:
    Inclusive: none

Systems: [pp, auau_cent0_20, auau_cent20_50, auau_cent50_80]
pp:

  # Per result: package, centrality class, the simulated samples of the response (summed with their cross section per
  # generated event), measurement photon bins, the response grids (package bins, same range),
  # iterations (a number or rule), and per photon bin R_bkg (1: the background factorises), a purity scale on the ABCD
  # signal and a DATA/simulation photon-efficiency scale (1: none), then the combinatoric-jet subtraction (1 or 0).
  # BackgroundCorrelation and PurityScale may be "qa": the R_bkg and purity non-closure the qa step derived from the
  # simulation (purity_study/ of Output.QA), for the systematic variations.
  # Every key is required, and a key the analysis does not know is an error.
  Package: PP
  Centrality: all
  Label: p+p
  Simulation: [photon5, photon10, photon20]
  PhotonEdges: [17, 23, 33]
  RecoEdges: [10, 15, 17, 23, 33, 35, 40]
  TruthEdges: [5, 10, 15, 17, 23, 33, 35, 40]
  PairIterations: scan
  PhotonIterations: scan
  BackgroundCorrelation: [1, 1]
  PurityScale: [1, 1]
  EfficiencyScale: [1, 1]
  SubtractCombinatoric: 1
auau_cent0_20:

  Package: AuAu
  Centrality: cent0_20
  Label: Au+Au 0-20%
  Simulation: [photon12, photon20]
  PhotonEdges: [17, 23, 33]
  RecoEdges: [10, 15, 17, 23, 33, 35, 40]
  TruthEdges: [5, 10, 15, 17, 23, 33, 35, 40]
  PairIterations: scan
  PhotonIterations: scan
  BackgroundCorrelation: [1, 1]
  PurityScale: [1, 1]
  EfficiencyScale: [1, 1]
  SubtractCombinatoric: 1
auau_cent20_50:

  Package: AuAu
  Centrality: cent20_50
  Label: Au+Au 20-50%
  Simulation: [photon12, photon20]
  PhotonEdges: [17, 23, 33]
  RecoEdges: [10, 15, 17, 23, 33, 35, 40]
  TruthEdges: [5, 10, 15, 17, 23, 33, 35, 40]
  PairIterations: scan
  PhotonIterations: scan
  BackgroundCorrelation: [1, 1]
  PurityScale: [1, 1]
  EfficiencyScale: [1, 1]
  SubtractCombinatoric: 1
auau_cent50_80:

  Package: AuAu
  Centrality: cent50_80
  Label: Au+Au 50-80%
  Simulation: [photon12, photon20]
  PhotonEdges: [17, 23, 33]
  RecoEdges: [10, 15, 17, 23, 33, 35, 40]
  TruthEdges: [5, 10, 15, 17, 23, 33, 35, 40]
  PairIterations: scan
  PhotonIterations: scan
  BackgroundCorrelation: [1, 1]
  PurityScale: [1, 1]
  EfficiencyScale: [1, 1]
  SubtractCombinatoric: 1
