# FinalAnalysis systematics: the sources of the systematic uncertainty of the per-photon results.
# ROOT TEnv format, "Key: value"; "#" starts a comment. Paths are relative to this file.
#
# Every results file below comes from a copy of config/analysis.cfg with exactly one change, run like the nominal:
#   final_analysis.sh run --config <copy>
# A source gives Up and Down (two-sided), one Alternative (mirrored), or Alternatives name=path ... with a Representative
# (an envelope: its band is the largest |shift|, its covariance the representative's). Correlated: 1 when the source is the
# same physical input in every system (varied together in the ratios). A source applies to the results its files hold.

Systematics.Nominal:            /path/to/results/results.root
Systematics.Output:             /path/to/results/systematics.root
Systematics.Sources:            prior_power prior_form iterations combinatoric_shape background_correlation purity_nonclosure jet_energy_scale
Systematics.Ratios:             auau_cent0_20/pp auau_cent20_50/pp auau_cent50_80/pp

# Prior.Power 1.5 and 0.5 (the ATLAS prior bracket).
prior_power.Family:             unfolding
prior_power.Correlated:         1
prior_power.Up:                 /path/to/results_prior_p15/results.root
prior_power.Down:               /path/to/results_prior_p05/results.root

# Prior.Form exp2.
prior_form.Family:              unfolding
prior_form.Correlated:          1
prior_form.Alternative:         /path/to/results_prior_exp2/results.root

# PairIterations one below and one above the rule's choice (fixed numbers in the copies).
iterations.Family:              unfolding
iterations.Correlated:          0
iterations.Alternatives:        minus=/path/to/results_k_minus/results.root plus=/path/to/results_k_plus/results.root
iterations.Representative:      plus

# Combinatoric.Shape flat.
combinatoric_shape.Family:      combinatoric
combinatoric_shape.Correlated:  0
combinatoric_shape.Alternative: /path/to/results_combinatoric_flat/results.root

# BackgroundCorrelation qa: R_bkg of the simulated non-signal candidates per photon bin (the qa step) instead of 1.
background_correlation.Family:      purity
background_correlation.Correlated:  0
background_correlation.Alternative: /path/to/results_rbkg/results.root

# PurityScale qa: the simulated purity non-closure per photon bin (the qa step; refused outside 0.5-1.5).
purity_nonclosure.Family:           purity
purity_nonclosure.Correlated:       0
purity_nonclosure.Alternative:      /path/to/results_purity_nonclosure/results.root

# The simulated response with Fill.ResponseVariation "jet_scale=1.03 seed=1" and "jet_scale=0.97 seed=1" (TreeToHists).
jet_energy_scale.Family:        jet_response
jet_energy_scale.Correlated:    1
jet_energy_scale.Up:            /path/to/results_jes_up/results.root
jet_energy_scale.Down:          /path/to/results_jes_down/results.root
