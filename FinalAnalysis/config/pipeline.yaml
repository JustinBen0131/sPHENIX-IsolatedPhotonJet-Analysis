# Run: ./FinalAnalysis/final_analysis.sh all --config /absolute/path/to/copied/pipeline.yaml
# Materialize every @TOKEN@ from validated collection/recipe manifests before running.
# Nominal remains the accepted smnom R04 collection (fixed pp in-situ reference 0.916).
# Its analysis settings keep BackgroundCorrelation and PurityScale equal to [1, 1],
# and must retain nominal inclusive samples for rbkg QA. Compare numerical objects and
# provenance with the pinned page basis (nominal.root SHA prefix 2db7a609); record raw SHA separately.
# DATA JES collections use exactly 1/0.907 (up) and 1/0.923 (down); AuAu JES is deferred by Justin.
# Named detector components use a separate typed raw-grid collection, with nominal DATA and
# full nominal sample coverage. Its top-level response recipe is empty, as required by NamedResponse.h.
# Every saved selection collection must contain coherent DATA + photonjet SIM for its selection,
# including its smnom response; other systems retain nominal inputs. Inclusive samples are optional
# there and are excluded through existing QA settings to avoid irrelevant selection-coverage checks.
# Only rbkg consumes nominal inclusive-SIM QA. Purity nonclosure is a diagnostic, outside the band.
# EMS recalculates calibration-dependent selection and couples the same scale to jet EM fraction.
# JER/EMR use their named shared draws, seed480. Timing is deferred and contributes no zero placeholder.
# No eventTree reduction, per-selection inclusive production or centrality-off inclusive production.
Pipeline:
  HistogramCollection: '@SMNOM_R04_COLLECTION@'
  AnalysisSettings: '@SMNOM_R04_ANALYSIS_SETTINGS@'
  SystematicsSettings: pipeline_systematics.yaml
  OutputDirectory: ./outputs/smnom_r04_v1
  Parallel: 1
  UseCollectionSamples: 1
  ExpectedFigures: '@REQUIRED_FIGURES@'
  Variations:
  - prior_half
  - k_minus
  - k_plus
  - sideband_low
  - sideband_mid
  - rbkg
  - purity_nonclosure
  - jes_up
  - jes_down
  - smjer_low
  - smjer_high
  - smemr_low
  - smemr_high
  - smems_low
  - smems_high
  - centralityoff
  - pp_tight_plus005
  - pp_lower_minus010
  - pp_gap01
  - pp_gap10
  - auau_tight60
  - auau_tight80
  - auau_lower02
  - auau_upper90
  - auau_iso70
  - auau_iso90
prior_half:
  Analysis:
    Prior:
      Fraction: 0.5
k_minus:
  Analysis:
    pp:
      PairIterations: nominal-1
      PhotonIterations: nominal-1
    auau_cent0_20:
      PairIterations: nominal-1
      PhotonIterations: nominal-1
    auau_cent20_50:
      PairIterations: nominal-1
      PhotonIterations: nominal-1
    auau_cent50_80:
      PairIterations: nominal-1
      PhotonIterations: nominal-1
k_plus:
  Analysis:
    pp:
      PairIterations: nominal+1
      PhotonIterations: nominal+1
    auau_cent0_20:
      PairIterations: nominal+1
      PhotonIterations: nominal+1
    auau_cent20_50:
      PairIterations: nominal+1
      PhotonIterations: nominal+1
    auau_cent50_80:
      PairIterations: nominal+1
      PhotonIterations: nominal+1
sideband_low:
  Analysis:
    Combinatoric:
      Sideband:
      - 0.8
      - 2.062
sideband_mid:
  Analysis:
    Combinatoric:
      Sideband:
      - 0.982
      - 2.258
rbkg:
  Analysis:
    pp:
      BackgroundCorrelation: qa
    auau_cent0_20:
