# The same sources as systematics.cfg, bound to the declared pipeline variations.
# Existing manual systematics.cfg commands still take ordinary results-file paths.
Systematics.Nominal:     @nominal
Systematics.Output:      systematics.root
Systematics.Sources:     prior_power prior_form iterations combinatoric_shape background_correlation purity_nonclosure jet_energy_scale
Systematics.Ratios:      auau_cent0_20/pp auau_cent20_50/pp auau_cent50_80/pp
prior_power.Family:      unfolding
prior_power.Correlated:  1
prior_power.Up:          @prior_p15
prior_power.Down:        @prior_p05
prior_form.Family:       unfolding
prior_form.Correlated:   1
prior_form.Alternative:  @prior_exp2
iterations.Family:      unfolding
iterations.Correlated:  0
iterations.Alternatives: minus=@k_minus plus=@k_plus
iterations.Representative: plus
combinatoric_shape.Family: combinatoric
combinatoric_shape.Correlated: 0
combinatoric_shape.Alternative: @combinatoric_flat
background_correlation.Family: purity
background_correlation.Correlated: 0
background_correlation.Alternative: @rbkg
purity_nonclosure.Family: purity
purity_nonclosure.Correlated: 0
purity_nonclosure.Alternative: @purity_nonclosure
jet_energy_scale.Family: jet_response
jet_energy_scale.Correlated: 1
jet_energy_scale.Up: @jes_up
jet_energy_scale.Down: @jes_down
